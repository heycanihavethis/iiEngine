name: Local build and verification
on:
  # Manual only — avoids burning private-repo Actions minutes on every push/PR.
  # Trigger from Actions → "Local build and verification" → Run workflow when publishing.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: engine
          POSTGRES_DB: engine_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U engine -d engine_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://engine@127.0.0.1:5432/engine_test
      DATABASE_URL: postgresql+psycopg://engine@127.0.0.1:5432/engine_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r services/api/requirements-dev.lock && python -m pip install --no-deps -e services/api
      - run: corepack pnpm format:check && corepack pnpm lint && corepack pnpm typecheck
      - run: corepack pnpm test && corepack pnpm build
      - run: python -m ruff check services/api && python -m ruff format --check services/api
      - name: Migration roundtrip and drift
        working-directory: services/api
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
      - run: python -m pytest services/api/tests -q
      - run: python scripts/check-source.py
      - name: Verify generated API contracts
        run: |
          python scripts/export-openapi.py
          corepack pnpm contracts:types
          git diff --exit-code -- packages/contracts
      - run: corepack pnpm audit --audit-level high
      - run: python -m pip_audit --skip-editable
      - run: python scripts/sbom.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-sbom
          path: outputs/sbom.cdx.json
          if-no-files-found: error
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: ./scripts/create-managed-fixtures.ps1
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      # No upload of game files, credentials, diagnostics, installers or releases.
