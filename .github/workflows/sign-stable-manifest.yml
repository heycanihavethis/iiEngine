name: Sign verified stable menu manifest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.1
      - name: Cross-check, download, hash and sign
        env:
          II_ENGINE_MANIFEST_PRIVATE_KEY: ${{ secrets.II_ENGINE_MANIFEST_PRIVATE_KEY }}
        run: python scripts/sign-stable-manifest.py signed-stable-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-stable-manifest
          path: signed-stable-manifest.json
          if-no-files-found: error
          retention-days: 7
