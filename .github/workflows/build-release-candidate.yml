name: Build unsigned Windows release candidate

on:
  workflow_dispatch:
  # Temporary: agent cannot workflow_dispatch (403). Remove after this RC finishes.
  push:
    branches:
      - cursor/telemetry-privacy-strip-comments-1353

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VITE_BACKEND_PUBLIC_URL: https://ii-engine-api-production.up.railway.app
      ENGINE_BACKEND_URL: https://ii-engine-api-production.up.railway.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: python -m pip install PyYAML==6.0.3
      - run: ./scripts/create-managed-fixtures.ps1
      - run: corepack pnpm format:check
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: corepack pnpm package
      - name: Assemble candidate files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force outputs/release | Out-Null
          Copy-Item 'apps/desktop/src-tauri/target/release/bundle/nsis/ii Engine_0.2.2_x64-setup.exe' outputs/release/
          Copy-Item 'apps/desktop/src-tauri/target/release/bundle/msi/ii Engine_0.2.2_x64_en-US.msi' outputs/release/
          Copy-Item docs/third-party-notices.md outputs/release/THIRD-PARTY-NOTICES.md
          Copy-Item LICENSE outputs/release/LICENSE
          git archive --format=zip --output=outputs/release/ii-Engine_0.2.2-source.zip HEAD
          python scripts/sbom.py
          Copy-Item outputs/sbom.cdx.json outputs/release/
          Get-ChildItem outputs/release -File | Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding ascii outputs/release/SHA256SUMS.txt
      - name: Verify candidate contains no excluded local material
        shell: pwsh
        run: |
          python scripts/check-source.py
          if (Select-String -Quiet -Path outputs/release/* -Pattern 'DISCORD_BOT_TOKEN=|NVIDIA_API_KEY=|REFRESH_TOKEN_PEPPER=' -SimpleMatch) {
            throw 'Potential secret marker found in release outputs'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ii-engine-0.2.2-unsigned-candidate
          path: outputs/release
          if-no-files-found: error
          retention-days: 14
